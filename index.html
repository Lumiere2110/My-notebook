<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My notebook</title>
  <meta name="description" content="ボックス・フォルダ・メモファイルで整理するノート。テキストボックス・付箋・手書きで自由に書けます。データはこのブラウザの中に保存されます。">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='3' fill='%23e8a317'/%3E%3Cpath d='M7 7h10M7 11h10M7 15h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="navToggle" type="button" title="メニュー" aria-label="メニュー"></button>
    <a class="brand" href="#" id="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">My notebook</span>
    </a>
    <div class="search" role="search">
      <span class="search-ic" id="searchIc"></span>
      <input id="search" type="search" placeholder="検索" autocomplete="off" aria-label="メモファイルを検索">
      <button class="icon-btn search-clear" id="searchClear" type="button" title="検索をクリア" aria-label="検索をクリア" hidden></button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="layoutBtn" type="button"></button>
      <button class="icon-btn" id="themeBtn" type="button"></button>
      <button class="icon-btn" id="moreBtn" type="button" title="その他" aria-label="その他"></button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="ボックス"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <input type="file" id="imgFile" accept="image/*" multiple hidden>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
